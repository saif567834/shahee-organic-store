<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAHEE Admin</title>
<style>body{font-family:system-ui;margin:0;background:#0b1a10;color:#f6efd9}.w{max-width:1100px;margin:auto;padding:16px}h1,h2{color:#e8b931}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #333;padding:6px;text-align:left;vertical-align:top}
input,select,button{font:inherit;padding:6px;border-radius:6px;border:1px solid #555;background:#13281a;color:inherit}button{background:#e8b931;color:#222;border:0;cursor:pointer}
.wrap{overflow-x:auto}.k{display:flex;gap:12px;flex-wrap:wrap}.k div{background:#13281a;padding:10px 16px;border-radius:10px}</style></head><body><div class="w">
<h1>SHAHEE ORGANIC – Admin</h1>
<div id="lg"><input id="e" type="email" placeholder="Email"> <input id="p" type="password" placeholder="Password"> <button onclick="login()">Login</button> <span id="m"></span></div>
<div id="ap" hidden><button onclick="out()">Logout</button><div class="k" id="k"></div><h2>Products</h2><div class="wrap" id="pr"></div><h2>Orders</h2><div class="wrap" id="or"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),R=p=>'₹'+(p/100).toLocaleString('en-IN');
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(async r=>{if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('Admin API is unavailable. Start the full app server and ensure MongoDB is connected.');const d=await r.json();if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d});
async function login(){try{await api('/api/auth/login','POST',{email:$('#e').value,password:$('#p').value});load()}catch(e){$('#m').textContent=e.message}}
async function out(){await api('/api/auth/logout','POST');location.reload()}
async function load(){let o,p;try{[o,p]=await Promise.all([api('/api/admin/orders'),api('/api/admin/products')])}catch{return}
$('#lg').hidden=true;$('#ap').hidden=false;
const live=o.filter(x=>x.status!=='CANCELLED'),sum=f=>live.filter(f).reduce((a,x)=>a+x.totalPaise,0);
$('#k').innerHTML=[['Orders',o.length],['Verified online payments',R(sum(x=>x.paymentStatus==='PAID'))],['COD collected',R(sum(x=>x.paymentStatus==='COD_COLLECTED'))],['COD pending',R(sum(x=>x.paymentStatus==='COD_PENDING'))],['Pending dispatch',live.filter(x=>x.status==='PLACED').length]].map(a=>`<div><small>${a[0]}</small><br><b>${esc(a[1])}</b></div>`).join('');
$('#pr').innerHTML='<table><tr><th>Name<th>Price ₹<th>Stock<th>Active<th></tr>'+p.map(x=>`<tr><td>${esc(x.name)}<td><input id="pp${x._id}" type="number" value="${x.pricePaise/100}" style="width:90px"><td><input id="ps${x._id}" type="number" value="${x.stock}" style="width:80px"><td><input id="pa${x._id}" type="checkbox" ${x.active?'checked':''}><td><button onclick="sp('${x._id}')">Save</button></tr>`).join('')+'</table>';
$('#or').innerHTML='<table><tr><th>Order<th>Customer<th>Items<th>Total<th>Payment<th>Status<th>Courier / tracking</tr>'+o.map(x=>`<tr><td>${esc(x.number)}<br><small>${new Date(x.createdAt).toLocaleString()}</small><td>${esc(x.customer.name)}<br>${esc(x.customer.phone)}<br><small>${esc(x.customer.address)} ${esc(x.customer.pin)}</small><td>${x.items.map(i=>esc(i.qty+' × '+i.name)).join('<br>')}<td>${R(x.totalPaise)}<td>${esc(x.method)}<br>${esc(x.paymentStatus)}${x.method==='COD'&&x.paymentStatus==='COD_PENDING'?`<br><button onclick="so('${x._id}',{paymentStatus:'COD_COLLECTED'})">Mark collected</button>`:''}<td><select onchange="so('${x._id}',{status:this.value})">${['PLACED','PACKED','SHIPPED','DELIVERED','CANCELLED'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><td><input id="c${x._id}" placeholder="Courier" value="${esc(x.courier)}" style="width:100px"> <input id="t${x._id}" placeholder="Tracking no." value="${esc(x.trackingNo)}" style="width:110px"> <button onclick="so('${x._id}',{courier:$('#c${x._id}').value,trackingNo:$('#t${x._id}').value})">Save</button></tr>`).join('')+'</table>'}
async function so(id,b){try{await api('/api/admin/orders/'+id,'PATCH',b);load()}catch(e){alert(e.message);load()}}
async function sp(id){try{await api('/api/admin/products/'+id,'PATCH',{pricePaise:Math.round($('#pp'+id).value*100),stock:+$('#ps'+id).value,active:$('#pa'+id).checked});load()}catch(e){alert(e.message)}}
load();
</script></body></html>
